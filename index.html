<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Fortnite Chest Counter</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b2940;--panel2:#243651;--blue:#5aa7ff;--cyan:#7de3ff;--text:#f4f7ff;--muted:#9eb0ca}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#20395b 0%,#101827 55%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}
.app{width:min(100%,420px);border:1px solid #385273;border-radius:26px;background:rgba(16,24,39,.94);box-shadow:0 22px 70px #0008;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-size:14px;font-weight:900;letter-spacing:.16em}
.tag{font-size:11px;font-weight:800;letter-spacing:.1em;color:#b8e7ff;background:#163b5b;border:1px solid #2b668f;padding:7px 10px;border-radius:99px}
.kicker{text-align:center;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.18em}
.total{margin:12px 0 18px;text-align:center;font-size:clamp(76px,22vw,104px);line-height:1;font-weight:900;letter-spacing:-.07em;font-variant-numeric:tabular-nums;text-shadow:0 0 28px #5aa7ff55}
.counter{border:1px solid #344e70;background:linear-gradient(145deg,#233b5c,#17263d);border-radius:21px;padding:23px 14px;margin-bottom:22px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:11px}
button{appearance:none;border:1px solid #46688f;border-radius:15px;min-height:62px;background:linear-gradient(180deg,#31547d,#203a5b);color:white;font-size:20px;font-weight:850;cursor:pointer;box-shadow:0 5px 0 #14263d;transition:transform .08s,filter .08s}
button:active{transform:translateY(3px);filter:brightness(1.15);box-shadow:0 2px 0 #14263d}
button small{display:block;font-size:10px;letter-spacing:.12em;color:#c6d8ee;margin-top:2px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1;min-height:48px;font-size:14px;background:#1b2940;box-shadow:none}
.actions .reset{border-color:#824b59;color:#ffc2ca;background:#382432}
.saved{text-align:center;color:var(--muted);font-size:11px;margin-top:19px}
</style>
</head>
<body>
<main class="app">
<header><div class="brand">FORTNITE <span style="color:#7de3ff">/</span> CHEST COUNTER</div><div class="tag">PS5</div></header>
<section class="counter" aria-live="polite">
<div class="kicker">TOTAL DE COFFRES</div>
<div class="total" id="total">0</div>
<div class="kicker">COFFRES COMPTABILISÉS</div>
</section>
<div class="buttons">
<button data-add="1">+1<small>COFFRE</small></button>
<button data-add="2">+2<small>COFFRES</small></button>
<button data-add="5">+5<small>COFFRES</small></button>
<button data-add="10">+10<small>COFFRES</small></button>
</div>
<div class="actions">
<button id="minus">− 1</button>
<button class="reset" id="reset">RÉINITIALISER</button>
</div>
<div class="saved" id="saved">Sauvegarde automatique activée sur cet appareil</div>
</main>
<script>
const KEY='fortnite-chest-counter-v1';
const totalEl=document.getElementById('total');
let total=0;
try { total=Math.max(0,parseInt(localStorage.getItem(KEY)||'0',10)||0); } catch(e) {}
function render(){totalEl.textContent=total.toLocaleString('fr-FR');try{localStorage.setItem(KEY,String(total));}catch(e){document.getElementById('saved').textContent='Sauvegarde indisponible dans ce navigateur';}}
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{total+=Number(b.dataset.add);render();}));
document.getElementById('minus').addEventListener('click',()=>{total=Math.max(0,total-1);render();});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Remettre le compteur à zéro ?')){total=0;render();}});
render();
</script>
</body>
</html>
